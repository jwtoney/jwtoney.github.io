cv:
  name: Jacob W. Toney
  label: PhD Candidate, Chemical Engineering & Computational Science, MIT
  email: jwt@mit.edu
  summary: >
    I develop machine learning methods for quantum chemistry, with a focus on the systems
    conventional models handle worst: open-shell, organometallic, and strongly correlated
    chemistry. My work spans graph neural networks for metal–ligand coordination, large
    quantum-chemical datasets across charge and spin states, uncertainty-aware architectures
    covering elements 1–100, and correlated wavefunction theory on classical and quantum
    hardware.

