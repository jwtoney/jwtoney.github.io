cv:
  name: Jacob W. Toney
  label: PhD Candidate, Chemical Engineering & Computational Science, MIT
  email: jwt@mit.edu
  summary: >
    PhD candidate in Chemical Engineering and Computational Science at MIT working at the
    intersection of machine learning and quantum chemistry. Developing geometric deep learning
    models and large quantum chemical datasets to predict the structural, electronic, and
    chemical properties of transition metal complexes. Additional technical experience in
    quantum computing algorithms for chemistry (IBM Research) and large-scale operations
    engineering (SpaceX).

