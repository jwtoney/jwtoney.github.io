    Experience:
      - company: Kulik Group, MIT Department of Chemical Engineering
        position: Graduate Research Assistant
        location: Cambridge, MA
        start_date: 2023-01
        highlights:
          - Developed graph neural networks to predict organometallic bonding in transition metal complexes from ligand structure (*PNAS*), and extended the approach to dynamic coordination modes using ensemble learning (*JACS*).
          - Co-led construction of BOS-TMC, the largest DFT dataset of experimentally characterized transition metal complexes in multiple charge and spin states (*JCIM*).
          - Supported development and benchmarking of state-of-the-art generative transition state models (*Nat. Comput. Sci.*).
          - Built ElemeNet, a unified machine learning framework for chemistry supporting E(3)-equivariant architectures with uncertainty quantification across the periodic table.
          - Designed novel physics-based molecular fingerprints from spectral graph theory to encode 3D information while preserving permutation and E(3) invariance.
          - Maintain the group HPC cluster and contribute to the open-source molSimplify structure generation package.

      - company: IBM Research
        position: Algorithms and Applications Intern
        location: Yorktown Heights, NY
        start_date: 2026-06
        end_date: 2026-08
        highlights:
          - Developed wavefunction embedding schemes for simulating large molecular systems on quantum computers.
          - Investigated fine-tuning generative models for protein structure prediction.

      - company: SpaceX
        position: Operations Engineer
        location: Hawthorne, CA
        start_date: 2021-06
        end_date: 2022-08
        summary: Full-time
        highlights:
          - Led cross-functional cost-reduction campaigns to optimize Falcon 9 production.

      - company: ExxonMobil Research & Technology Development
        position: Process Engineering R&D Intern
        location: Houston, TX
        start_date: 2020-06
        end_date: 2020-08
        highlights:
          - Developed computational tool for automated heat-exchanger design, reducing engineering labor hours by 10%.

      - company: Sharada Group, USC Department of Chemical Engineering and Materials Science
        position: Undergraduate Researcher
        location: Los Angeles, CA
        start_date: 2019-01
        end_date: 2021-05
        highlights:
          - Performed DFT mechanistic studies of C–H hydroxylation by enzyme-inspired copper–oxygen complexes.
          - Published in *Catal. Sci. Technol.* and recognized with departmental awards for best research paper and presentation.

