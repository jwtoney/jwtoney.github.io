        start_date: 2022
        end_date: 2027
        highlights:
          - "Thesis: *Accelerating Quantum Chemistry with Machine Learning for the Rational Design of Transition Metal Complexes*"
          - "Coursework: computational chemistry, advanced electronic structure theory, machine learning algorithms, ML for chemistry, matrix calculus for ML, diffusion models, generative AI and stochastic differential equations, numerical methods, Bayesian modeling and inference"

