        start_date: 2022
        end_date: 2027
        highlights:
          - "Thesis: *Accelerating Quantum Chemistry with Machine Learning for the Rational Design of Transition Metal Complexes*"
          - "Selected coursework: Electronic Structure Theory, Computational Chemistry, Machine Learning, Bayesian Modeling and Inference, Diffusion Models, Generative AI and Stochastic Differential Equations, Matrix Calculus, Numerical Methods"

